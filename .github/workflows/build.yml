name: Build exe & apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  e2e:
    # تجربة حقيقية للخدمات المجانية وعمل ريل كامل (للفحص فقط)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - run: dart run tool/e2e.dart e2e_out
      - name: pipeline report
        if: always()
        run: |
          tail -n 7 e2e_out/pipeline.txt | sed 's/%/%25/g; s/^/::notice::/' || true
          for f in e2e_out/out/*.mp4; do echo "::notice::$(basename "$f") $(ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of csv=p=0 "$f" | tr '\n' ' ')"; done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e
          path: |
            e2e_out/out
            e2e_out/edge.mp3

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ReelsMaker-Windows-Portable.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/ReelsMaker.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            ReelsMaker-Windows-Portable.zip
            installer/Output/ReelsMaker-Setup.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Rename apks
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ReelsMaker-Android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ReelsMaker-Android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/ReelsMaker-Android-x86_64.apk || true
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/*.apk

  release:
    needs: [windows, android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'آخر نسخة (latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          body: |
            ## صانع الريلز
            - **ويندوز:** نزّل `ReelsMaker-Setup.exe` (مثبّت) أو `ReelsMaker-Windows-Portable.zip` (بدون تثبيت).
            - **أندرويد:** نزّل `ReelsMaker-Android-arm64.apk` (لأغلب الجوالات). لو ما اشتغل جرّب `arm32`.

            Commit: ${{ github.sha }}
          files: |
            out/windows/ReelsMaker-Windows-Portable.zip
            out/windows/installer/Output/ReelsMaker-Setup.exe
            out/android/*.apk
