name: Build exe & apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  e2e:
    # تجربة حقيقية للخدمات المجانية وعمل ريل كامل (للفحص فقط)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - name: diag free services
        continue-on-error: true
        run: |
          pip install -q edge-tts || true
          if edge-tts --voice ar-SA-HamedNeural --text "مرحبا هذا اختبار للصوت" --write-media py_edge.mp3; then echo "::notice::py edge-tts OK $(stat -c%s py_edge.mp3)"; else echo "::notice::py edge-tts FAILED"; fi
          echo "::notice::edge-tts version $(pip show edge-tts | grep Version)"
          c() { code=$(curl -s -o r.txt -w '%{http_code}' --max-time 60 "$@"); echo "::notice::$code $1 :: $(head -c 300 r.txt | tr '\n' ' ')"; }
          c "https://text.pollinations.ai/%D9%82%D9%84%20%D9%85%D8%B1%D8%AD%D8%A8%D8%A7?model=openai"
          c "https://text.pollinations.ai/hello"
          c https://text.pollinations.ai/openai -H 'Content-Type: application/json' -d '{"model":"openai","messages":[{"role":"user","content":"hi"}]}'
          c https://text.pollinations.ai/ -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}'
          c https://text.pollinations.ai/models
          c https://gen.pollinations.ai/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"openai","messages":[{"role":"user","content":"hi"}]}'
          c https://api.llm7.io/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"قل مرحبا"}]}'
          c https://api.llm7.io/v1/models
      - name: diag capture
        continue-on-error: true
        run: |
          cat > cap.py <<'PY'
          import socket
          srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(('127.0.0.1', 8765)); srv.listen(5); srv.settimeout(120)
          for n in range(4):
              try: c, _ = srv.accept()
              except Exception: break
              c.settimeout(5)
              try: data = c.recv(65536).decode('latin1')
              except Exception: data = ''
              print('::notice::REQ%d %s' % (n, data.replace('\r\n', ' || ')))
              c.close()
          PY
          python3 cap.py > cap.log &
          sleep 1
          python3 - <<'PY' || true
          import asyncio, edge_tts, edge_tts.communicate as cm
          cm.WSS_URL = 'ws://127.0.0.1:8765/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4'
          async def m():
              try: await edge_tts.Communicate('مرحبا هذا اختبار', 'ar-SA-HamedNeural').save('x.mp3')
              except Exception as e: print('py err', e)
          asyncio.run(m())
          PY
          CAPTURE=1 timeout 60 dart run tool/diag.dart || true
          sleep 2; cat cap.log
      - name: diag dart
        continue-on-error: true
        run: PY_GEC=$(python3 -c "from edge_tts.drm import DRM; print(DRM.generate_sec_ms_gec())") dart run tool/diag.dart
      - run: dart run tool/e2e.dart e2e_out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e
          path: |
            e2e_out/out
            e2e_out/edge.mp3

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ReelsMaker-Windows-Portable.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/ReelsMaker.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            ReelsMaker-Windows-Portable.zip
            installer/Output/ReelsMaker-Setup.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Rename apks
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ReelsMaker-Android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ReelsMaker-Android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/ReelsMaker-Android-x86_64.apk || true
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/*.apk

  release:
    needs: [windows, android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'آخر نسخة (latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          body: |
            ## صانع الريلز
            - **ويندوز:** نزّل `ReelsMaker-Setup.exe` (مثبّت) أو `ReelsMaker-Windows-Portable.zip` (بدون تثبيت).
            - **أندرويد:** نزّل `ReelsMaker-Android-arm64.apk` (لأغلب الجوالات). لو ما اشتغل جرّب `arm32`.

            Commit: ${{ github.sha }}
          files: |
            out/windows/ReelsMaker-Windows-Portable.zip
            out/windows/installer/Output/ReelsMaker-Setup.exe
            out/android/*.apk
